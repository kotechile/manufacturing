services:
  po-chaser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: po-chaser-app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - HERMES_API_KEY=${HERMES_API_KEY:-}
      - HERMES_API_BASE=${HERMES_API_BASE:-https://openrouter.ai/api/v1}
      - HERMES_MODEL=${HERMES_MODEL:-nousresearch/hermes-3-llama-3.1-70b}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      # Persistent Obsidian-style Markdown knowledge vault
      - ./vault:/app/vault
      # Persistent Hermes skills definition
      - ./skills:/app/skills
      # Persistent sample data
      - ./sample_data:/app/sample_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
